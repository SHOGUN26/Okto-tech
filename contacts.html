<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <body>

    <header>
      <div class="logo">

      <nav>

      <div class="contact-grid">

          </div>

          <div class="contact-info-block">
            <h3>Nous joindre</h3>
            <p>
              Gratuit : 01 23 45 67 89<br />Tél : 01 23 45 67 89<br />Fax : 01
              23 45 67 89
